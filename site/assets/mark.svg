  -->
  <path d="M27 13.5 V20 A7 7 0 0 1 20 27 H12 A7 7 0 0 1 5 20 V12 A7 7 0 0 1 12 5 H18.5 C25 5 30 10 24.5 14.5"
        fill="none" stroke="#F97316" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
